name: Smart University Android CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build_and_test:
    name: Build, Lint & Test Enterprise APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradle
        run: chmod +x gradlew || true

      - name: Run Android Lint Static Analysis
        run: ./gradlew lintDebug --continue || true

      - name: Run Local JVM Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK & AAB
        run: ./gradlew assembleRelease bundleRelease || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-university-debug-apk
          path: app/build/outputs/apk/debug/*.apk
